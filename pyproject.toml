[project]
name = "django-blog"
version = "0.1.0"
description = "A Django blog with tags, search, comments and Fly.io deployment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=6.1.1,<6.2",
    "django-taggit>=6.1.0,<6.2",
    "gunicorn>=26.2.0,<26.3",
    "Markdown>=3.10.3,<3.11",
    "whitenoise>=6.12.0,<6.13",
]

[tool.uv]
package = false
